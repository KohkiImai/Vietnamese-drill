<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ベトナム語">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ベトナム語ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column, set picker + mode bar, quiz card (VI prompt + two JA choices), list or vocab view */
:root {
  --bg: #f5f7f4;
  --surface: #ffffff;
  --fg: #1d2a24;
  --muted: #64746c;
  --line: #dde4df;
  --accent: #1f7a5a;
  --accent-soft: #e2f1ea;
  --on-accent: #ffffff;
  --good: #1f7a5a;
  --good-soft: #dff2e8;
  --bad: #b23a3a;
  --bad-soft: #f8e3e1;
  --font-vi: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121815; --surface: #19211d; --fg: #e4ece7; --muted: #93a39a;
    --line: #2b3631; --accent: #5cc49b; --accent-soft: #1f3329; --on-accent: #0f1512;
    --good: #5cc49b; --good-soft: #1d3428; --bad: #ef8a80; --bad-soft: #3a2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121815; --surface: #19211d; --fg: #e4ece7; --muted: #93a39a;
  --line: #2b3631; --accent: #5cc49b; --accent-soft: #1f3329; --on-accent: #0f1512;
  --good: #5cc49b; --good-soft: #1d3428; --bad: #ef8a80; --bad-soft: #3a2220;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ja); line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; padding-block: 28px 48px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: .92rem; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: .9rem; border: 0; background: transparent; color: var(--fg); padding: 7px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--accent-soft); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.select-wrap { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
select { font: inherit; font-size: .95rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; max-width: 100%; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 18px; }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.progress { height: 6px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; }
.prompt-label { color: var(--muted); font-size: .8rem; letter-spacing: .04em; margin: 0; }
.prompt { font-family: var(--font-vi); font-size: clamp(1.5rem, 5.5vw, 2.1rem); font-weight: 700; margin: 0; text-wrap: balance; }
.choices { display: grid; gap: 10px; }
.prompt.ja-prompt { font-family: var(--font-ja); font-size: clamp(1.35rem, 5vw, 1.8rem); }
.choice .vi-text { font-family: var(--font-vi); font-weight: 600; }
.feedback .speak { display: inline-grid; vertical-align: middle; margin-left: 8px; }
.choice {
  font: inherit; font-size: 1.05rem; text-align: left; color: var(--fg);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: center;
}
.choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.choice .key { flex: none; width: 1.8rem; height: 1.8rem; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: .85rem; color: var(--muted); }
.choice:disabled { cursor: default; }
.choice.correct { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.dim { opacity: .55; }
.feedback { min-height: 1.6em; font-weight: 700; margin: 0; }
.feedback.ok { color: var(--good); }
.feedback.ng { color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.primary { font: inherit; font-weight: 700; border: 0; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 10px 22px; cursor: pointer; }
.ghost { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 10px 18px; cursor: pointer; }
.ghost:hover { background: var(--accent-soft); }

.score { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 0; }
.score small { font-size: 1rem; color: var(--muted); font-weight: 400; }
.misses { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.misses li { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vi { font-family: var(--font-vi); font-weight: 600; }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.list li { display: grid; grid-template-columns: 2.4rem minmax(0,1fr) minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 9px 12px 9px 16px; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .num { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.list .vi { font-size: 1.05rem; }
.group-title { font-size: .95rem; margin: 20px 0 8px; }
.group-title:first-child { margin-top: 0; }
.vocab li { grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; }

.prompt-row { display: flex; align-items: center; gap: 12px; }
.prompt-row .prompt { flex: 1; min-width: 0; }
.speak {
  flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; padding: 0;
}
.speak:hover { background: var(--accent-soft); border-color: var(--accent); }
.speak.sm { width: 2.1rem; height: 2.1rem; }
.speak.sm svg { width: 16px; height: 16px; }
.misses .speak.sm { display: inline-grid; vertical-align: middle; margin-left: 4px; }
.toggle {
  font: inherit; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.toggle svg { width: 16px; height: 16px; }
.toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.voice-warn { font-size: .85rem; color: var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 10px 12px; margin: -6px 0 18px; }

.alt-link { margin: -10px 0 18px; font-size: .9rem; }
.alt-link a { color: var(--accent); font-weight: 600; }

.notes { margin-top: 24px; font-size: .9rem; color: var(--muted); }
.notes h2 { font-size: .95rem; color: var(--fg); margin: 0 0 6px; }
.notes ul { margin: 0; padding-left: 1.2em; }
.notes b { font-family: var(--font-vi); color: var(--fg); }

@media (max-width: 480px) {
  .list li { grid-template-columns: 2rem minmax(0,1fr) auto; row-gap: 2px; }
  .list li .ja { grid-column: 2; grid-row: 2; }
  .list li .speak { grid-column: 3; grid-row: 1 / span 2; }
  .vocab li { grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; }
  .vocab li .ja, .vocab li .speak { grid-column: auto; grid-row: auto; }
  .misses li { grid-template-columns: minmax(0,1fr); gap: 2px; }
  .card { padding: 18px; }
}
@media (prefers-reduced-motion: no-preference) {
  .progress > i { transition: width .25s; }
  .choice { transition: background .12s, border-color .12s; }
}
</style>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
body { -webkit-text-size-adjust: 100%; }
button { -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
</style>

</head>
<body>

<div class="wrap">
  <h1>ベトナム語ドリル</h1>
  <p class="sub" id="subText">同じ単語を組み合わせた100問。出題の向きを選んで、正しい答えを2つから選びましょう。</p>
  <p class="alt-link" id="altLink" hidden></p>

  <div class="bar">
    <label class="select-wrap" for="setSel">問題
      <select id="setSel"></select>
    </label>
    <div class="seg" role="group" aria-label="表示">
      <button id="mQuiz" data-mode="quiz" aria-pressed="true">クイズ</button>
      <button id="mList" data-mode="list" aria-pressed="false">一覧</button>
      <button id="mVocab" data-mode="vocab" aria-pressed="false">単語</button>
    </div>
    <div class="seg" role="group" aria-label="出題の向き" id="dirSeg">
      <button id="dVi" data-dir="vi" aria-pressed="true">ベトナム語 → 日本語</button>
      <button id="dJa" data-dir="ja" aria-pressed="false">日本語 → ベトナム語</button>
    </div>
  </div>

  <div class="bar" id="audioBar">
    <button class="toggle" id="autoBtn" aria-pressed="true"><span id="autoIcon"></span>自動で読み上げ</button>
    <div class="seg" role="group" aria-label="読み上げの速さ">
      <button id="rNormal" data-rate="normal" aria-pressed="true">ふつう</button>
      <button id="rSlow" data-rate="slow" aria-pressed="false">ゆっくり</button>
    </div>
  </div>
  <p class="voice-warn" id="voiceWarn" hidden></p>

  <div id="view"></div>
  <div class="notes" id="notes"></div>
</div>

<script src="sentences.js"></script>
<script>
// Flat list of all 100 items: [vi, ja, setIndex]
const ALL = SETS.flatMap((s, si) => s.items.map(([vi, ja]) => [vi, ja, si]));
const RANDOM_N = 20;
// 公開用ファイルでは出題の向きを固定する（"vi"＝ベトナム語→日本語、"ja"＝日本語→ベトナム語、null＝切り替え可）
const FIXED_DIR = null;

const S = { set: 0, mode: "quiz", dir: "vi", queue: [], pos: 0, score: 0, misses: [], answered: false };
try {
  const s = JSON.parse(localStorage.getItem("vi-drill-100") || "{}");
  if (Number.isInteger(s.set) && s.set >= 0 && s.set <= SETS.length + 1) S.set = s.set;
  if (["quiz","list","vocab"].includes(s.mode)) S.mode = s.mode;
  if (s.dir === "vi" || s.dir === "ja") S.dir = s.dir;
} catch (e) {}
if (FIXED_DIR) S.dir = FIXED_DIR;
const save = () => { try { localStorage.setItem("vi-drill-100", JSON.stringify({ set: S.set, mode: S.mode, dir: S.dir })); } catch (e) {} };

const view = document.getElementById("view");
const sel = document.getElementById("setSel");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const words = t => t.toLowerCase().replace(/[.,?!]/g, "").split(/\s+/);

// Which item indices (into ALL) belong to the current selection
function poolIndices() {
  if (S.set < SETS.length) return ALL.map((x, i) => i).filter(i => ALL[i][2] === S.set);
  return ALL.map((x, i) => i); // ランダム / 全100問
}

// Pick a distractor that shares many words with the correct sentence, so you must read every word
function pickDistractor(idx) {
  const target = words(ALL[idx][0]);
  const scored = ALL.map((x, i) => {
    if (i === idx || x[1] === ALL[idx][1]) return null;
    const w = words(x[0]);
    const shared = w.filter(t => target.includes(t)).length;
    const lenDiff = Math.abs(w.length - target.length);
    return { i, score: shared * 2 - lenDiff };
  }).filter(Boolean).sort((a, b) => b.score - a.score);
  const top = scored.slice(0, 4);
  return top[Math.floor(Math.random() * top.length)].i;
}

// ---- 読み上げ（端末の音声合成を使う）----
const SPEAKER = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const A = { auto: true, rate: "normal" };
try {
  const a = JSON.parse(localStorage.getItem("vi-drill-audio") || "{}");
  if (typeof a.auto === "boolean") A.auto = a.auto;
  if (a.rate === "normal" || a.rate === "slow") A.rate = a.rate;
} catch (e) {}
const saveAudio = () => { try { localStorage.setItem("vi-drill-audio", JSON.stringify(A)); } catch (e) {} };
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let viVoice = null;
let userActed = false; // スマホは最初のタップ前に音を出せないため
function loadVoices() {
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  viVoice = vs.find(v => /^vi([-_]|$)/i.test(v.lang)) || null;
  const warn = document.getElementById("voiceWarn");
  if (vs.length && !viVoice) {
    warn.textContent = "この端末にはベトナム語の読み上げ音声が見つかりません。Androidは「設定 → テキスト読み上げ」でGoogleの音声エンジンにベトナム語を追加してください。";
    warn.hidden = false;
  } else warn.hidden = true;
}
function speak(text) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/〜/g, " "));
  u.lang = "vi-VN";
  if (viVoice) u.voice = viVoice;
  u.rate = A.rate === "slow" ? 0.6 : 0.9;
  speechSynthesis.speak(u);
}
const sayBtn = (text, cls) => `<button class="speak${cls ? " " + cls : ""}" data-say="${esc(text)}" aria-label="読み上げる">${SPEAKER}</button>`;

function startQuiz(indices) {
  let q = shuffle(indices || poolIndices());
  if (!indices && S.set === SETS.length) q = q.slice(0, RANDOM_N);
  S.queue = q; S.pos = 0; S.score = 0; S.misses = []; S.answered = false;
  showQuestion();
}

function showQuestion() {
  const idx = S.queue[S.pos];
  const [vi, ja] = ALL[idx];
  const rev = S.dir === "ja"; // 日本語を見てベトナム語を選ぶ
  const d = pickDistractor(idx);
  const opts = shuffle([{ text: rev ? vi : ja, ok: true }, { text: rev ? ALL[d][0] : ALL[d][1], ok: false }]);
  S.answered = false;
  const total = S.queue.length;
  view.innerHTML = `
    <div class="card">
      <div class="meta"><span>第 ${S.pos + 1} 問 / ${total}</span><span id="sc">正解 ${S.score}</span></div>
      <div class="progress"><i style="width:${(S.pos / total) * 100}%"></i></div>
      <p class="prompt-label">${rev ? "ベトナム語で言うと？" : "この文の意味は？"}</p>
      ${rev ? `<p class="prompt ja-prompt" lang="ja">${esc(ja)}</p>`
            : `<div class="prompt-row"><p class="prompt" lang="vi">${esc(vi)}</p>${sayBtn(vi)}</div>`}
      <div class="choices">
        ${opts.map((o, i) => `<button class="choice" id="opt${i}" data-ok="${o.ok}"><span class="key">${i + 1}</span><span${rev ? ' class="vi-text" lang="vi"' : ""}>${esc(o.text)}</span></button>`).join("")}
      </div>
      <p class="feedback" id="fb" aria-live="polite"></p>
      <div class="actions"><button class="primary" id="next" hidden>${S.pos + 1 < total ? "次の問題" : "結果を見る"}</button></div>
    </div>`;
  view.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => answer(btn)));
  document.getElementById("next").addEventListener("click", next);
  if (!rev && A.auto && userActed) speak(vi);
}

function answer(btn) {
  if (S.answered) return;
  S.answered = true;
  const ok = btn.dataset.ok === "true";
  const fb = document.getElementById("fb");
  view.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b.dataset.ok === "true") b.classList.add("correct");
    else if (b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if (ok) { S.score++; fb.textContent = "正解！"; fb.className = "feedback ok"; }
  else { S.misses.push(S.queue[S.pos]); fb.textContent = "不正解。緑色が正しい答えです。"; fb.className = "feedback ng"; }
  if (S.dir === "ja") {
    const vi = ALL[S.queue[S.pos]][0];
    fb.insertAdjacentHTML("beforeend", sayBtn(vi, "sm"));
    if (A.auto) speak(vi);
  }
  document.getElementById("sc").textContent = `正解 ${S.score}`;
  const n = document.getElementById("next");
  n.hidden = false; n.focus();
}

function next() {
  S.pos++;
  if (S.pos < S.queue.length) showQuestion(); else showResult();
}

function showResult() {
  const total = S.queue.length;
  const msg = S.score === total ? "全問正解です！" : S.score >= total * 0.8 ? "よくできました。" : "間違えた文を見直してみましょう。";
  view.innerHTML = `
    <div class="card">
      <p class="prompt-label">結果</p>
      <p class="score">${S.score}<small> / ${total} 問正解</small></p>
      <p style="margin:0">${msg}</p>
      ${S.misses.length ? `<div><p class="prompt-label" style="margin-bottom:6px">間違えた文</p><ul class="misses">
        ${S.misses.map(i => `<li><span class="vi" lang="vi">${esc(ALL[i][0])} ${sayBtn(ALL[i][0], "sm")}</span><span>${esc(ALL[i][1])}</span></li>`).join("")}
      </ul></div>` : ""}
      <div class="actions">
        ${S.misses.length ? `<button class="primary" id="retryMiss">間違えた問題だけもう一度</button>` : ""}
        <button class="${S.misses.length ? "ghost" : "primary"}" id="retryAll">最初からもう一度</button>
      </div>
    </div>`;
  const rm = document.getElementById("retryMiss");
  if (rm) rm.addEventListener("click", () => startQuiz(S.misses.slice()));
  document.getElementById("retryAll").addEventListener("click", () => startQuiz());
}

function showList() {
  const sets = S.set < SETS.length ? [S.set] : SETS.map((_, i) => i);
  view.innerHTML = sets.map(si => {
    const rows = SETS[si].items.map(([vi, ja], i) =>
      `<li><span class="num">${si * 20 + i + 1}</span><span class="vi" lang="vi">${esc(vi)}</span><span class="ja">${esc(ja)}</span>${sayBtn(vi, "sm")}</li>`).join("");
    return `${sets.length > 1 ? `<h2 class="group-title">${esc(SETS[si].name)}</h2>` : ""}<ol class="list">${rows}</ol>`;
  }).join("");
}

function showVocab() {
  view.innerHTML = VOCAB.map(([title, list]) =>
    `<h2 class="group-title">${title}</h2><ul class="list vocab">${list.map(([vi, ja]) =>
      `<li><span class="vi" lang="vi">${esc(vi)}</span><span class="ja">${esc(ja)}</span>${sayBtn(vi, "sm")}</li>`).join("")}</ul>`).join("");
}

function renderNotes() {
  const el = document.getElementById("notes");
  if (S.mode === "vocab") { el.innerHTML = ""; return; }
  if (S.set < SETS.length) el.innerHTML = `<h2>ポイント</h2><ul>${SETS[S.set].note}</ul>`;
  else el.innerHTML = `<h2>ポイント</h2><ul><li>選択肢には、正解とよく似た文（同じ単語を使った文）が出ます。主語・場所・動詞を1語ずつ確かめましょう。</li></ul>`;
}

function render() {
  sel.value = String(S.set);
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === S.mode)));
  document.querySelectorAll("[data-dir]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.dir === S.dir)));
  document.getElementById("dirSeg").hidden = S.mode !== "quiz" || !!FIXED_DIR;
  sel.disabled = S.mode === "vocab";
  renderNotes();
  if (S.mode === "quiz") startQuiz(); else if (S.mode === "list") showList(); else showVocab();
}

sel.innerHTML = SETS.map((s, i) => `<option value="${i}">${esc(s.name)}（20問）</option>`).join("")
  + `<option value="${SETS.length}">全体からランダム（${RANDOM_N}問）</option>`
  + `<option value="${SETS.length + 1}">全100問</option>`;
sel.addEventListener("change", () => { S.set = +sel.value; save(); render(); });
document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { S.mode = b.dataset.mode; save(); render(); }));
document.querySelectorAll("[data-dir]").forEach(b => b.addEventListener("click", () => { S.dir = b.dataset.dir; save(); render(); }));
document.addEventListener("keydown", e => {
  if (S.mode !== "quiz" || e.target.tagName === "SELECT") return;
  if ((e.key === "1" || e.key === "2") && !S.answered) {
    const b = document.getElementById("opt" + (+e.key - 1)); if (b) b.click();
  } else if (e.key === "Enter" && S.answered) {
    const n = document.getElementById("next"); if (n && document.activeElement !== n) n.click();
  }
});

if (FIXED_DIR) {
  const sub = document.getElementById("subText"), alt = document.getElementById("altLink");
  if (FIXED_DIR === "vi") {
    sub.textContent = "同じ単語を組み合わせた100問。ベトナム語の文を見て（聞いて）、正しい日本語を2つから選びましょう。";
    alt.innerHTML = '逆向きの練習：<a href="ja.html">日本語 → ベトナム語 版</a>';
  } else {
    sub.textContent = "同じ単語を組み合わせた100問。日本語の文を見て、正しいベトナム語を2つから選びましょう。";
    alt.innerHTML = '逆向きの練習：<a href="./">ベトナム語 → 日本語 版</a>';
  }
  alt.hidden = false;
}

// 読み上げの操作
document.addEventListener("pointerdown", () => { userActed = true; }, { capture: true });
document.addEventListener("keydown", () => { userActed = true; }, { capture: true });
view.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say); });
const autoBtn = document.getElementById("autoBtn");
document.getElementById("autoIcon").innerHTML = SPEAKER;
function renderAudio() {
  autoBtn.setAttribute("aria-pressed", String(A.auto));
  document.querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.rate === A.rate)));
}
autoBtn.addEventListener("click", () => { A.auto = !A.auto; saveAudio(); renderAudio(); });
document.querySelectorAll("[data-rate]").forEach(b => b.addEventListener("click", () => { A.rate = b.dataset.rate; saveAudio(); renderAudio(); }));
if (canSpeak) {
  loadVoices();
  speechSynthesis.addEventListener("voiceschanged", loadVoices);
} else {
  document.getElementById("audioBar").hidden = true;
  const w = document.getElementById("voiceWarn");
  w.textContent = "このブラウザは読み上げに対応していません。"; w.hidden = false;
}
renderAudio();

render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
